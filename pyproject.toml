[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LoggerClassUtils"
version = "0.1.0"
description = "Reusable logger class for Python projects."
authors = [ { name = "MasterGabe" } ]
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["logger_class","__init__","logger_setup"]

[project.readme]
file = "README.md"
content-type = "text/markdown"
